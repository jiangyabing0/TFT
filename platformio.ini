; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -Iinclude
    -include include/User_Setup.h
    ; 修复 WebServer 库在 ESP32 Arduino core 3.x 下找不到头文件的问题
    -I C:/Users/57592/.platformio/packages/framework-arduinoespressif32/libraries/WiFi/src
    -I C:/Users/57592/.platformio/packages/framework-arduinoespressif32/libraries/FS/src
    ; 增大 Arduino loop 任务栈，防止 RTCWDT_RTC_RESET 看门狗复位（栈溢出导致）
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; 打开 Arduino-ESP32 内核的警告/错误日志（2=WARN）。
    ; 默认是 0（NONE），SD 卡挂载失败时看不到 sd_diskio 的具体原因；
    ; 打开后 [E][sd_diskio.cpp] Card Failed!/GO_IDLE_STATE failed 表示卡无应答（接线/供电/坏卡），
    ; f_mount failed: (13) There is no valid FAT volume 表示文件系统不是 FAT（exFAT/NTFS）。
    ; 排查完可以改回 -DCORE_DEBUG_LEVEL=0 减少串口噪音。
    -DCORE_DEBUG_LEVEL=2



   

lib_deps = 
    bodmer/TFT_eSPI@^2.5.0
    paulstoffregen/XPT2046_Touchscreen
    bodmer/TJpg_Decoder@^1.0.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    khoih-prog/ESPAsync_WiFiManager    ; 与 AsyncWebServer 兼容的 WiFiManager
    ; ESPAsyncDNSServer 已放在本地 lib/ 目录，无需从 GitHub 下载



    
board_build.filesystem = littlefs  ; 关键：开启文件系统

; 指定上传和监视的串口（你的 ESP32 是 CH340，位于 COM5）
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
; 串口监视器过滤器：
;   default = 默认（彩色、自动换行等）
;   time    = 每行前加时间戳，便于和事件对照
;   log2file = 把整个串口输出同时存成项目目录下的 platformio-device-monitor-*.log
;              （方便直接把日志发给别人分析；不想要就删掉这一行的 log2file）
monitor_filters = default, time, log2file


